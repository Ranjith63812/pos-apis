version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - npm --prefix inventory-ui install
    build:
      commands:
        - npm --prefix inventory-ui run build
  artifacts:
    baseDirectory: inventory-ui/build
    files:
      - '**/*'
  cache:
    paths:
      - inventory-ui/node_modules/**/*
